<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f7fc" />
    <meta name="description" content="Centre de pilotage des indicateurs de performance — Tunisie Telecom, Direction Régionale Ben Arous." />
    <title>Centre KPI · Tunisie Telecom — Direction Régionale Ben Arous</title>
    <script>
      (function () {
        // L'application démarre toujours sur la vue TV (jamais persistée en
        // session), qui est elle-même toujours forcée en clair (fond noir
        // écarté par l'encadrant) : on peint donc directement en clair avant
        // hydratation, pour éviter tout flash sombre même si un thème sombre
        // a été choisi lors d'une session précédente sur une autre vue.
        document.documentElement.setAttribute("data-theme", "light");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
